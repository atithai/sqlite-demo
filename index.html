<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQLite Demo - quiz1.db</title>
  <!-- โหลด library sql.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .search-box { margin-bottom: 15px; }
    #status { font-weight: bold; margin-bottom: 15px; color: #333; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; }
  </style>
</head>
<body>

  <h1>ข้อมูลจาก quiz1.db</h1>
  
  <div id="status">กำลังเริ่มต้น...</div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="พิมพ์ชื่อเพื่อค้นหา..." onkeyup="if(event.key === 'Enter') searchData()">
    <button onclick="searchData()">ค้นหา</button>
  </div>

  <table id="resultTable" style="display: none;">
    <thead>
      <tr id="tableHeader"></tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <script src="app.js"></script>
</body>
</html>
